; CharaDock StackChan (M5Stack K151 / CoreS3)

[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = espressif32 @ 7.0.1
board = m5stack-cores3
framework = arduino
board_build.partitions = default_16MB.csv
extra_scripts = pre:build_path_scrub.py

monitor_speed = 500000
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_ldf_mode = chain+
lib_deps =
    https://github.com/m5stack/StackChan-BSP.git#8d4d6fc3b7a6be379c6317c45a02a30bff8c492e
    m5stack/M5Unified @ 0.2.21
    m5stack/M5GFX @ 0.2.28
    bblanchon/ArduinoJson @ 7.4.3
lib_ignore =
    IRremoteESP8266
    M5Unit-NFC
    M5UnitUnified
    M5HAL
    M5Utility

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=1
    -D UART_SCLK_DEFAULT=UART_SCLK_APB
    -D CHARADOCK_ENABLE_SERVO_ON_BOOT=0
