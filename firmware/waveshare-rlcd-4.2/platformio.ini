; CharaDock Waveshare ESP32-S3-RLCD-4.2

[platformio]
default_envs = waveshare-rlcd-42
; M5 targets in this repository use Arduino-ESP32 2.x while pioarduino uses
; 3.x. PlatformIO otherwise gives both frameworks the same global package
; name, so building one target can replace the other's toolchain.
packages_dir = ${platformio.core_dir}/packages-charadock-pioarduino3

[env:waveshare-rlcd-42]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.partitions = partitions.csv
board_build.embed_files =
    src/generated/shinonome12.bin
    src/generated/shinonome16.bin
extra_scripts = pre:build_path_scrub.py
lib_extra_dirs = ../../shared

monitor_speed = 500000
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_ldf_mode = chain+
lib_deps =
    olikraus/U8g2 @ 2.36.18
    bblanchon/ArduinoJson @ 7.4.3

build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
